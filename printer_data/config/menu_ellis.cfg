# menu_ellis.cfg

[gcode_macro __CFG_MARKER_menu_ellis]
gcode:
    RESPOND PREFIX="CFG" MSG="Loaded: menu_ellis.cfg"

[menu __main ellis]
type: list
name: Ellis Calibration

[menu __main ellis fullcal]
type: command
name: Run Full Calibration
gcode:
  ELLIS_FULL_CALIBRATION




# ---------- HEAT & PREP ----------
[menu __main ellis heat]
type: list
name: Heat & Prep

[menu __main ellis heat pla]
type: command
name: Heat PLA (200/60)
gcode:
  M140 S60
  M104 S200
  M190 S60
  M109 S200

# ---------- SCREWS TILT ----------
[menu __main ellis screws]
type: list
name: Bed Level (Screws)

[menu __main ellis screws start]
type: command
name: Screws Tilt Adjust
gcode:
  G28
  SCREWS_TILT_CALCULATE

# ---------- Z OFFSET ----------
[menu __main ellis zoffset]
type: list
name: Z Offset

[menu __main ellis zoffset start]
type: command
name: Start Z Offset
gcode:
  G28
  PROBE_CALIBRATE

[menu __main ellis zoffset save]
type: command
name: Save Z Offset
gcode:
  SAVE_CONFIG

# ---------- BED MESH ----------
[menu __main ellis mesh]
type: list
name: Bed Mesh

[menu __main ellis mesh create]
type: command
name: Create Mesh
gcode:
  G28
  BED_MESH_CALIBRATE

[menu __main ellis mesh save]
type: command
name: Save Mesh
gcode:
  SAVE_CONFIG

