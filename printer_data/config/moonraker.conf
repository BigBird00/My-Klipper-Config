[server]
host = 0.0.0.0
port = 7125
klippy_uds_address: /home/ajs/printer_data/comms/klippy.sock
ignore_invalid_config: True
force_sdcard_upload: False

[history]

[config]
ignore_section: SAVE_VARIABLES

[authorization]
trusted_clients =
    127.0.0.1
    0.0.0.0/0

[file_manager]
enable_object_processing = True

[update_manager]
refresh_interval: 168
enable_auto_refresh: True

[update_manager client moonraker]
type: git_repo
path: ~/moonraker
origin: https://github.com/Arksine/moonraker.git
install_script: ~/moonraker/scripts/install-moonraker.sh

[update_manager client klipper]
type: git_repo
path: ~/klipper
origin: https://github.com/Klipper3d/klipper.git

[update_manager client mainsail]
type: web
path: ~/mainsail
origin: https://github.com/mainsail-crew/mainsail.git

