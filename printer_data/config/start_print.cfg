[gcode_macro MACHINE_PARTICULARS]
description: Perform machine-specific checks
gcode:
     {% set machinename = params.MACHINE|default("")|replace('"','')|lower %}

    {% if machinename == "creality ender-3 pro" %}
        RESPOND MSG="***** Creality Ender-3 Pro: Verify Walls->Hole Horizontal Expansion is 0.45"
    {% elif machinename == "Voron 2.4" %}
        RESPOND MSG="***** Voron 2.4 detected"
    {% elif machinename == "Bambu X1C" %}
        RESPOND MSG="***** Bambu X1C detected"
    {% else %}
        RESPOND MSG="***** Unknown machine: { machinename }"
    {% endif %}



[gcode_macro MATERIAL_PARTICULARS]
description: Dispatch to the correct material macro
gcode:
    {% set material = params.MATERIAL|default("")|upper|replace('"','') %}

    {% if material == "PLA" %}
        MATERIAL_PARTICULARS_PLA
    {% elif material == "PETG" %}
        MATERIAL_PARTICULARS_PETG
    {% elif material == "TPU" %}
        MATERIAL_PARTICULARS_TPU
    {% else %}
        {action_respond_error("Unknown material '" ~ material ~ "'")}
        END_PRINT
    {% endif %}




[gcode_macro SET_NOZZLE_SIZE]
variable_nozzle: 0.4
gcode:
    {% if nozzle == 0.4 %}
        SET_PRESSURE_ADVANCE ADVANCE=0.04
        #RESPOND msg="PA Set for 0.04"
    {% elif nozzle == 0.6 %}
        SET_PRESSURE_ADVANCE ADVANCE=0.030
        #RESPOND msg="PA Set for 0.03"
    {% elif nozzle == 0.8 %}
        SET_PRESSURE_ADVANCE ADVANCE=0.020
        #RESPOND msg="PA Set for 0.02"
    {% endif %}




[gcode_macro LOG_PRINT_END]
description: "Record end time and write duration to file"
