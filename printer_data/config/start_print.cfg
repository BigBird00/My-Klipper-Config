[gcode_macro RUN_ON_READY]
gcode:
    #RESPOND MSG="RUN_ON_READY"
    {% set sv = printer.SAVE_VARIABLES.variables %}
    {% set last_file = sv.last_file | default("") %}
    {% set filepath = sv.filepath | default("") %}
    {% set is_printing = printer.virtual_sdcard.is_active|default(False) %}
    #RESPOND MSG="is_printing = {is_printing}"
    #RESPOND MSG="last_file = {last_file}"
    #RESPOND MSG="filepath = {filepath}"
    # Only show popup if:
    # 1. PLR variables indicate an interrupted print
    # 2. Klipper is NOT currently printing
    {% if last_file != "" and filepath != "" and not is_printing %}
        RESPOND TYPE=command MSG="action:prompt_begin Power-loss detected"
        RESPOND TYPE=command MSG="action:prompt_text A previous print was interrupted."
        RESPOND TYPE=command MSG="action:prompt_text Run Resume Print to continue."
        RESPOND TYPE=command MSG="action:prompt_footer_button Resume|RESUME"
        RESPOND TYPE=command MSG="action:prompt_show"
    {% endif %}

