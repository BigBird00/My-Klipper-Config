#####################################   TEMPS

[gcode_macro SET_TEMP_NOWAIT]
description = Set bed + hotend to low temps (no wait)
gcode:
    {% set bed = params.BED|float %}
    {% set cool = params.EXTRUDER|float %}

    RESPOND MSG="SET_TEMP_NOWAIT: Bed={bed} Cool={cool}"

    M140 S{bed}
    M104 S{cool}


[gcode_macro SET_TEMP_WAIT]
description = Heat bed first, then hotend
gcode:
    {% set bed = params.BED|float %}
    {% set extruder = params.EXTRUDER|float %}

# start heating hot end to extrusion temp, nowait as we want it to heat up if we are waiting for bed
#    RESPOND  MSG="background Heating hotend to {extruder} [No Wait]"
    M104 S{extruder}
    M140 S{bed}
    WAIT_FOR_TEMPS BED={bed} EXTRUDER={extruder}
    RESPOND MSG="Temps OK"
    M117 Temps OK


[gcode_macro CHANGED_BED]
description: We changed bed - either to pei, glass, turned over
gcode:
  SET_GCODE_VARIABLE MACRO=GLOBAL_VARS VARIABLE=mesh_done VALUE=False
  
[gcode_macro BED_MESH_ONCE]
description: Run bed mesh once per power-on, or when no mesh exists
gcode:

    {% if not printer["gcode_macro GLOBAL_VARS"].mesh_done %}
        RESPOND  MSG="Starting bed mesh calibration"
        BED_MESH_CALIBRATE
        SET_GCODE_VARIABLE MACRO=GLOBAL_VARS VARIABLE=mesh_done VALUE=True
    {% else %}
        RESPOND  MSG="No BedMesh calibration needed"
    {% endif %}

[gcode_macro PERFORM_BED_MESH]
description: starts warming up & does bed mesh cal and saves it
gcode:
    RESPONE MSG="in [gcode_macro PERFORM_BED_MESH]"
    M104 S195
    M140 S35

    SET_KINEMATIC_POSITION Z=0
    G91
    G1 Z10 F600
    G90
    RESPONE MSG="in [gcode_macro PERFORM_BED_MESH @1"

    G28
    RESPONE MSG="in [gcode_macro PERFORM_BED_MESH @2"
    BED_MESH_CALIBRATE
    RESPONE MSG="in [gcode_macro PERFORM_BED_MESH @3"
    SAVE_CONFIG


[gcode_macro WAIT_FOR_TEMPS]
description: Wait for bed and/or extruder temps with no-wait set
gcode:
    # -------------------------------
    # Validate parameters
    # -------------------------------
    {% set has_bed = 'BED' in params %}
    {% set has_ext = 'EXTRUDER' in params %}

    # -------------------------------------------
    # Setup BED heater if provided (M140) nowait)
    # -------------------------------------------
    {% if has_bed %}
        {% set bed_target = params.BED|float %}
        {% set bed_threshold = bed_target - 1 %}
        M140 S{bed_target}
    {% endif %}

    # -------------------------------------------------
    # Setup EXTRUDER heater if provided (M104, no wait)
    # -------------------------------------------------
    {% if has_ext %}
        {% set ext_target = params.EXTRUDER|float %}
        {% set ext_threshold = ext_target - 1 %}
        M104 S{ext_target}
    {% endif %}

    # -------------------------------------------------
    # Error if no BED or EXTRUDER Params Passed
    # -------------------------------------------------
    {% if not has_bed and not has_ext %}
        #RESPOND PREFIX="TEMP" MSG="ERROR: BED= or EXTRUDER= parameter required."
        RETURN
    {% endif %}

    # -------------------------------
    # BED wait loop
    # -------------------------------
    {% if has_bed %}
        {% if printer.heater_bed.temperature|float < bed_threshold %}
            RESPOND MSG="Waiting for bed to reach target temperature..."
            M117 Waiting for Bed to reach target temperature...
            M190 S{bed_target}
        {% endif %}
    {% endif %}

    # -------------------------------
    # EXTRUDER wait loop
    # -------------------------------
    {% if has_ext %}
        {% if printer.extruder.temperature|float < ext_threshold %}
            RESPOND MSG="Waiting for Extruder to reach target temperature..."
            M117 Waiting for Extruder to reach target temperature...
            M109 S{ext_target}
        {% endif %}
    {% endif %}

