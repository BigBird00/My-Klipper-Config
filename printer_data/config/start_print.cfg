[gcode_macro __CFG_MARKER_start_print]
gcode:
    RESPOND PREFIX="CFG" MSG="Loaded: start_print.cfg"


[gcode_macro _GLOBAL_VARS]
description: holds various variables to act like a global variable
variable_mesh_done: False
variable_last_filename: ""
variable_machine_name: ""
gcode:
    M400



[gcode_macro DISABLE_PA]
gcode:
    SET_PRESSURE_ADVANCE ADVANCE=0


[gcode_macro TEST_RW]
description: TEST_RW
gcode:
    {% set totallayers = params.TOTLAYERS|default(657)|int %}

    RESPOND MSG="TEST_RW Layers:{totallayers}"
    SET_GCODE_VARIABLE MACRO=GLOBAL_STORAGE VARIABLE=totallayers VALUE="{totallayers}"
    SAVE_VARIABLE VARIABLE=totallayers VALUE={totallayers}

    TEST_TOTAL
    {% set TotLayers1 = printer["gcode_macro GLOBAL_STORAGE"].totallayers %}
    RESPOND MSG="ReadBack TotLayers1: {TotLayers1}"


[gcode_macro START_PRINT]
description: Start print with passed-in temps,material,etc
; gcode parameters for area bed mesh
variable_parameter_AREA_START : 0,0
variable_parameter_AREA_END : 0,0
gcode:
    G90
    RESPOND MSG="Starting START_PRINT"
    {% set bed = params.BED|default(60)|float %}
    {% set extruder = params.EXTRUDER|default(200)|float %}
    {% set extrudercool = params.EXTRUDERCOOL|default(extruder-30)|float %}
    {% set material = params.MATERIAL|default("PLA")|string %}
    {% set totallayers = params.TOTLAYERS|default(0)|int %}
    {% set IgnorePA = params.IgnorePA|default(0)|int %}
    {% set objectcount = params.OBJECTCOUNT|default(1)|float %}
    {% set home = params.HOME|default(1)|int %}
#  normalized to LC

    {% set machinename = params.MACHINE|default("")|replace('"','')|lower %}
    SET_GCODE_VARIABLE MACRO=_GLOBAL_VARS VARIABLE=machine_name VALUE="'{machinename}'"

    M104 S{extruder}
    M140 S{bed}
    RESPOND MSG="START_PRINT: {material} Bed:{bed} PrintTemp:{extruder} Standby:{extrudercool}"
    RESPOND MSG="START_PRINT: MachineName:{machinename}  Objects:{objectcount}  Layers:{totallayers}"
# do BED_MESH_CALIBRATE for print area
# Call your helper macro and forward the slicer parameters
    CHECK_BED_MESH_AREA AREA_START={params.AREA_START|default('0,0')} AREA_END={params.AREA_END|default('0,0')}

#  Reset layerALT times
    SET_GCODE_VARIABLE MACRO=LAYER_STATS VARIABLE=last_time VALUE=0
    SET_GCODE_VARIABLE MACRO=LAYER_STATS VARIABLE=times VALUE='""'

    {% if home > 0  %}
        CONDITIONAL_HOME
    {% endif %}

#      save totlayers for later
    SET_GCODE_VARIABLE MACRO=GLOBAL_STORAGE VARIABLE=totallayers VALUE="{totallayers}"
    SAVE_VARIABLE VARIABLE=totallayers VALUE={totallayers}
    {% set TotLayers = printer["gcode_macro GLOBAL_STORAGE"].TotalNumberOfLayers %}

    SET_PLR_NEW_FILE

    MACHINE_PARTICULARS MACHINE="{machinename}"
    MATERIAL_PARTICULARS MATERIAL="{material}"

    SET_BEDMESH_PROFILE
    RESPOND MSG="before SET_TEMP_NOWAIT.."
    SET_TEMP_NOWAIT BED={bed} EXTRUDER={extruder}

#    RESPOND MSG="before BETTER_PID_STATUS"
#    BETTER_PID_STATUS

     # set speed rate to 100%
    M220 S100

    G92 E0

    SET_TEMP_WAIT BED={bed} EXTRUDER={extruder}

    {% if IgnorePA == 0 %}
        ###  do NOT make SET_PRESSURE_ADVANCE!
        SET_PRESSUREADVANCE MACHINE="{machinename}" MATERIAL="{material}"
    {% else %}
        {action_respond_info("Ignoring SET_PRESSUREADVANCE")}
        M117 Ignoring SET_PRESSUREADVANCE
    {% endif %}

    {% if home > 0  %}
        #LED_PRINTING
        PRINT_PRIMELINE
    {% endif %}


      # Start print timer only now
    #SET_PRINT_STATS_INFO TOTAL_LAYER={totallayers} CURRENT_LAYER=0 PROGRESS=0
    # FILAMENT_USED=0


    {% set count = objectcount|int %}
    {% set plural = "s" if count != 1 else "" %}
    RESPOND MSG="Starting Print Of { count } Object{ plural }"
    M117 Starting Print

[gcode_macro CHECK_BED_MESH_AREA]
gcode:
    # Capture parameters passed from START_PRINT (defaulting to '0,0')
    {% set area_start = params.AREA_START|default('0,0')|string %}
    {% set area_end = params.AREA_END|default('0,0')|string %}
    
    # Split and convert coordinates to floats for comparison
    {% set start_x = area_start.split(',')[0]|float %}
    {% set start_y = area_start.split(',')[1]|float %}
    {% set end_x = area_end.split(',')[0]|float %}
    {% set end_y = area_end.split(',')[1]|float %}
    {% set diff_x = (end_x - start_x)|abs %}
    {% set diff_y = (end_y - start_y)|abs %}


    # Check if any coordinate exceeds 180 and run TEST if true
    {% if (diff_x > 180) or (diff_y > 180) %}
        { action_respond_info("Area coordinate exceeds 180!") }
        RESPOND MSG="No New Mesh Calibrate Needed"
     {% else %}
        RESPOND MSG="    BedMesh: AREA_START=({start_x}, {start_y}) AREA_END=({end_x}, {end_y})"
        BED_MESH_CALIBRATE AREA_START={params.AREA_START|default("0,0")} AREA_END={params.AREA_END|default("0,0")} PROBE_COUNT=4,4
    {% endif %}


[gcode_macro SET_BEDMESH_PROFILE]
description: Handles BedMesh
gcode:
