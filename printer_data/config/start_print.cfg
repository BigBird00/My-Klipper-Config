[gcode_macro PRINT_PRIMELINE]
description: Prints prime line (this one works on Creality Ender 3 Pro)
gcode:
    RESPOND MSG="Printing Prime Line"
    M117 Print Prime Line
    # 1. get machine name as LOWERCASE
    {% set machine = printer['gcode_macro _GLOBAL_VARS'].machine_name|default("")|lower %}
    RESPOND MSG="  Machine Name: {machine}"
    
    # 2. Conditional logic based on the machine name
    {% if machine == "creality ender-3 pro" %}
        { action_respond_info("Printer matched: Creality Ender-3 Pro - PrimeLine1") }
        PRINT_PRIME_LINE_ENDER_3_PRO
    {% elif "ender-3" in machine %}
        { action_respond_info("Printer matched: Ender-3 variant - PrimeLine2") }
        PRINT_PRIME_LINE_ENDER_3_PRO
    {% else %}
        { action_respond_info("Printer matched: Generic (Default Prime Line)") }
        PRINT_PRIME_LINE_GENERIC
    {% endif %}

    RESPOND MSG="Printed Prime Line"


[gcode_macro PRINT_PRIME_LINE_ENDER_3_PRO]
description: Prints Prime Line For Ender 3 Pro
gcode:
    G1 Z2.0 F3000
    G1 X0.1 Y20 Z0.3 F5000.0
    G1 X0.1 Y200.0 Z0.3 F1500.0 E15
    G1 X0.4 Y200.0 Z0.3 F5000.0
    G1 X0.4 Y20 Z0.3 F1500.0 E30
    G92 E0
    G1 Z2.0 F3000
    G1 X5 Y20 Z0.3 F5000.0


[gcode_macro PRINT_PRIME_LINE_GENERIC]
description: Prints Prime Line For Ender 3 Pro
gcode:
    G1 Z2.0 F3000
    G1 X0.1 Y20 Z0.3 F5000.0
    G1 X0.1 Y200.0 Z0.3 F1500.0 E15
    G1 X0.4 Y200.0 Z0.3 F5000.0
    G1 X0.4 Y20 Z0.3 F1500.0 E30
    G92 E0
    G1 Z2.0 F3000
    G1 X5 Y20 Z0.3 F5000.0



