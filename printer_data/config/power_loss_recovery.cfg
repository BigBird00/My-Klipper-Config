
# printer_loss_recover.cfg

#######################################
#   set options in extras/power_loss_recover.py
#   near the top of def __init__




# ============================
#  POWER LOSS RECOVERY MACROS
# ============================



[gcode_macro PLR_MARK_INTERRUPTED]
description: Mark PLR state as interrupted
gcode:
    SAVE_VARIABLE VARIABLE=was_interrupted VALUE=True

[gcode_macro PLR_CLEAR_INTERRUPTED]
description: Clear PLR interruption flag
gcode:
    SAVE_VARIABLE VARIABLE=was_interrupted VALUE=False

[gcode_macro PLR_CLEAR_LAST_FILE]
description: Clear PLR state at end of print
gcode:
    SAVE_VARIABLE VARIABLE=was_interrupted VALUE=False
    SAVE_VARIABLE VARIABLE=last_file VALUE="'none'"
    SAVE_VARIABLE VARIABLE=resume_meta_info VALUE="none"

[gcode_macro PLR_END_PRINT]
description: PLR end-of-print handler (normal completion)
gcode:
    #RESPOND PREFIX="PLR" MSG="In PLR_END_PRINT (normal completion)"

[gcode_macro PLR_SAFE_CANCEL]
description: Safe cancel that marks interrupted and calls base cancel
gcode:
    #RESPOND PREFIX="PLR" MSG="PLR_SAFE_CANCEL: marking interrupted"
    SAVE_VARIABLE VARIABLE=was_interrupted VALUE=True
    CANCEL_PRINT_BASE

[gcode_macro PLR_ABORT]
description: Abort PLR and clear all PLR state
gcode:
    #RESPOND PREFIX="PLR" MSG="PLR_ABORT: clearing PLR state"
    SAVE_VARIABLE VARIABLE=was_interrupted VALUE="False"
    SAVE_VARIABLE VARIABLE=last_file VALUE="'none'"
    SAVE_VARIABLE VARIABLE=resume_meta_info VALUE="''"

[gcode_macro PLR_RESUME]
description: Resume print using saved PLR state
gcode:
    {% set plr = printer["SAVE_VARIABLES"].variables %}
    {% if plr.was_interrupted != True %}
        #RESPOND PREFIX="PLR" MSG="No interrupted print to resume"
    {% else %}
        #RESPOND PREFIX="PLR" MSG="Restoring saved print state..."
        {% set state = plr.resume_meta_info %}
        {% set pos = state.position %}
        {% set x = pos.x %}
        {% set y = pos.y %}
        {% set z = pos.z %}
        {% set e = pos.e %}
        {% set file = plr.last_file %}

        #RESPOND PREFIX="PLR" MSG="Restoring heaters..."
        M104 S{state.hotend_target}
        M140 S{state.bed_target}
        M109 S{state.hotend_target}
        M190 S{state.bed_target}

        #RESPOND PREFIX="PLR" MSG="Restoring fan..."
        M106 S{state.fan_speed * 255}

        #RESPOND PREFIX="PLR" MSG="Restoring pressure advance..."
        SET_PRESSURE_ADVANCE ADVANCE={state.pressure_advance}

        {% if state.bed_mesh %}
            #RESPOND PREFIX="PLR" MSG="Restoring bed mesh..."
            BED_MESH_CLEAR
            BED_MESH_MAP PROFILE=default
        {% endif %}

        #RESPOND PREFIX="PLR" MSG="Restoring position..."
        G90
        G92 E{e}
        G1 X{x} Y{y} F6000
        G1 Z{z} F3000

        #RESPOND PREFIX="PLR" MSG="Resuming file: {file}"
        #RESPOND PREFIX="PLR" MSG="Resuming streamed print..."
        RESUME_BASE

    {% endif %}


[gcode_macro PLR_RESUME_READY]
description: Prepare printer for PLR resume
gcode:
    {% set svv = printer.SAVE_VARIABLES.variables %}
    {% if 'resume_meta_info' in svv %}
        {% set resume_info = svv.resume_meta_info %}
        {% set bed_center_x = printer.configfile.config.stepper_x.position_max|float / 2 %}
        {% set bed_center_y = printer.configfile.config.stepper_y.position_max|float / 2 %}

        M140 S{resume_info.bed_temp}
        M104 S{resume_info.hotend_temp}
        M190 S{resume_info.bed_temp}
        M109 S{resume_info.hotend_temp}

        SET_KINEMATIC_POSITION X={bed_center_x} Y={bed_center_y} Z=0
        G91
        G1 Z5 F1200
        G90
    {% else %}
        { action_respond_info("PLR: No resume_meta_info found to restore temperatures.") }
    {% endif %}

[gcode_macro PLR_BEFORE_RESUME_GCODE]
description: Pre-resume positioning
gcode:
    {% set bed_center_x = printer.configfile.config.stepper_x.position_max|float / 2 %}
    {% set bed_center_y = printer.configfile.config.stepper_y.position_max|float / 2 %}
    G28 X
    G28 Y
    G1 X{bed_center_x} Y{bed_center_y} F2000
    SET_KINEMATIC_POSITION Z=0

[gcode_macro PLR_RESUME_PRINT_START]
description: Resume print start sequence
gcode:
    {% set svv = printer.SAVE_VARIABLES.variables %}
    {% if 'resume_meta_info' in svv %}
        {% set resume_info = svv.resume_meta_info %}
        {% set target_x = resume_info.position.x|float %}
        {% set target_y = resume_info.position.y|float %}
        {% set target_z = resume_info.position.z|float %}

        PLR_RESUME_READY

        G91
        G1 Z5 F1200
        G90

        G28 X Y

        {% if 'saved_mesh_profile' in svv %}
            PLR_LOAD_MESH
        {% endif %}

        PLR_ENABLE

        G1 X{target_x} Y{target_y} F3000
        G1 Z{target_z} F1200

        M107
        G92 E0
        G1 E5.0 F1800
        G92 E0
        G90
        G21
        M83
        RESTORE_FAN_SPEEDS
    {% endif %}


[gcode_macro RESTORE_FAN_SPEEDS]
description: Restore fan speeds from saved state
gcode:
    {% set svv = printer.SAVE_VARIABLES.variables %}
    {% if 'resume_meta_info' not in svv %}
        { action_respond_info("No saved state found in variables") }
    {% else %}
        {% set state = svv.resume_meta_info %}
        {% if 'fan_speeds' not in state %}
            { action_respond_info("No fan speed data found in saved state") }
        {% else %}
            {% set fan_speeds = state.fan_speeds %}
            {% set cur_extruder = printer.toolhead.extruder %}

            {% for fan_name, speed in fan_speeds.items() %}
                {% if fan_name == 'fan' or fan_name == cur_extruder + '_fan' %}
                    {% set speed_byte = (speed * 255.0 + 0.5)|int %}
                    M106 P0 S{speed_byte}
                    { action_respond_info("Setting parts cooling fan %s using M106: S%d (%.1f%%)" % (fan_name, speed_byte, speed * 100.0)) }
                {% else %}
                    {% if fan_name in printer %}
                        SET_FAN_SPEED FAN={fan_name} SPEED={speed}
                        { action_respond_info("Setting generic fan %s using SET_FAN_SPEED: %.1f%%" % (fan_name, speed * 100.0)) }
                    {% else %}
                        { action_respond_info("Warning: Fan %s not found - skipping" % fan_name) }
                    {% endif %}
                {% endif %}
            {% endfor %}
        {% endif %}
    {% endif %}



[gcode_macro PLR_TEST]
description: Test PLR layer-change save without printing
gcode:
    #RESPOND PREFIX="PLR" MSG="=== PLR TEST START ==="
    #RESPOND PREFIX="PLR" MSG="Triggering fake layer 0"
    PLR_SAVE_PRINT_STATE_WITH_LAYER L=0 Z=0.20
    #RESPOND PREFIX="PLR" MSG="Triggering fake layer 1"
    PLR_SAVE_PRINT_STATE_WITH_LAYER L=1 Z=0.40
    #RESPOND PREFIX="PLR" MSG="Triggering fake layer 2"
    PLR_SAVE_PRINT_STATE_WITH_LAYER L=2 Z=0.60
    #RESPOND PREFIX="PLR" MSG="=== PLR TEST COMPLETE ==="



