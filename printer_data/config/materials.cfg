[gcode_macro __CFG_MARKER_materials]
gcode:
    RESPOND PREFIX="CFG" MSG="Loaded: materials.cfg"


[gcode_macro MATERIAL_PARTICULARS_PLA]
description: Set Z offset and retraction for PLA

gcode:
    # Literal constants
	# was .03
    {% set newoffset = 0.04 %}
    {% set newretract = 0.5 %}

    {% set newoffset_str = "%.3f"|format(newoffset) %}
    {% set newretract_str = "%.3f"|format(newretract) %}
 
    {% set gcode_offset = "SET_GCODE_OFFSET Z=" ~ newoffset_str ~ " MOVE=1" %}
    {% set gcode_retract = "SET_RETRACTION LENGTH=" ~ newretract_str %}
 
    {gcode_offset}
    {gcode_retract}
 

