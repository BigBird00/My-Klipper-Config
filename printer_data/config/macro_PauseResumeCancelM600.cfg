#################### M600 (Filament Change) Alias

##  ## [gcode_macro M600]
##  ## #rename_existing: M600.1
##  ## description: Filament Change
##  ## gcode:
##  ##     {% set x_park = 0 %}
##  ##     {% set y_park = 0 %}
##  ##     {% set z_lift = 10 %}
##  ## 
##  ##     RESPOND TYPE=command MSG="Filament change initiated"
##  ##     M117 Filament Change
##  ## 
##  ##     PAUSE
##  ## 
##  ##     G91
##  ##     G1 Z10 F600
##  ##     G90
##  ##     G1 X0 Y0 F6000
##  ## 
##  ##     RESPOND TYPE=command MSG="Change filament and press Resume"
##  ##     M117 Change Filament and Press Resume
##  ## 
##  ## # FILAMENT_CHANGE TEMP={params.TEMP|default(220)}
##  ## 
##  ## 


[gcode_macro M600]
description: Filament Change
gcode:
    {% set E = params.E|default(15)|float %}

    # 1 Save state so the printer can return to where it left off
    G90
    M82
    SAVE_PRINTER_COORDINATES
    SAVE_GCODE_STATE NAME=M600_state

    # 2. After save we can change coords, extrusion,
    #    Retract filament slightly in relative mode
    G91
    G1 E-{E} F300
    G90
    # 2. Trigger pause (this automatically executes your PAUSE macro above, 
    # which lifts Z and parks the toolhead)
    PAUSE

    # 3. Restore state once the user hits resume
    #.          exact position, feed rate, and relative/absolute mode saved by M600
    #  MOVE=1 restores X,Y,Z positions
    #  MOVE_SPEED tell it how fast to move to position
    RESTORE
    DISPLAY_PRINTER_COORDINATES
    RESTORE_GCODE_STATE NAME=M600_state
    DISPLAY_PRINTER_COORDINATES



[gcode_macro PURGE_MORE]
description: Purge an extra 10mm of filament during pause
gcode:
    # Ensure relative extrusion mode
    M83
    G1 E10 F300
    RESPOND TYPE=command MSG="Purged 5mm. Purge more or click Resume on your UI."

[gcode_macro RETRACT_MORE]
description: retract extra 20mm of filament during pause
gcode:
    # Ensure relative extrusion mode
    M83
    G1 E-20 F300
    RESPOND TYPE=command MSG="Retracted 20mm. Retract/Purge more or Resume on Printer"


[gcode_macro FILAMENT_CHANGE]
description: Filament change (sensorless)
gcode:
    RESPOND MSG="*** PRINT PAUSED — CHANGE FILAMENT ***"
    M117 *** PRINT PAUSED — CHANGE FILAMENT ***
    PAUSE Z_MIN=10





