#  macro_end_print.cfg
[gcode_macro __CFG_MARKER_macro_end_print]
gcode:
    RESPOND PREFIX="CFG" MSG="Loaded: macro_end_print.cfg"

[gcode_macro END_PRINT]
gcode:
    PLR_END_PRINT
    BRING_PRINT_FORWARD
    LOG_PRINT_END
    TURN_HEATERS_OFF
    G91                     ; Relative positioning
    G1 E-1 Z10 F2400        ; Retract and raise
    G90                     ; Absolute positioning    
    RESET_Z_OFFSET          ; set Z offset back to 0
	M84 X Y E               ; Disable all steppers but Z
    SET_SKEW CLEAR=1
    #LED_COMPLETE
    #BEEP_TRIPLE

[gcode_macro CLIENT_CANCEL_PRINT]
description: Cancel the actual running print (client UI)
gcode:
    RESPOND MSG="In Client_cancel_print"
    M117 Canceling Print
#   M112 stops gcode flow
    M112
    G91 
    G1 E-1 Z10 F2400
    ##### get user parameters or use default #####
    {% set client = printer['gcode_macro _CLIENT_VARIABLE']|default({}) %}
    {% set allow_park = client.park_at_cancel|default(false)|lower == 'true' %}
    {% set retract = client.cancel_retract|default(5.0)|abs %}
    ##### define park position #####
    RESPOND MSG="    @1 Client_cancel_print"
    {% set park_x = "" if (client.park_at_cancel_x|default(none) is none)
        else "X=" ~ client.park_at_cancel_x %}
    {% set park_y = "" if (client.park_at_cancel_y|default(none) is none)
        else "Y=" ~ client.park_at_cancel_y %}
    {% set custom_park = park_x|length > 0 or park_y|length > 0 %}
    ##### end of definitions #####
    # restore idle_timeout time if needed
#ajs    {% if printer['gcode_macro RESUME'].restore_idle_timeout > 0 %}
#ajs        SET_IDLE_TIMEOUT TIMEOUT={printer.configfile.settings.idle_timeout.timeout}
#ajs    {% endif %}
    RESPOND MSG="    @2 Client_cancel_print"
    {% if (custom_park or not printer.pause_resume.is_paused) and allow_park %}
        _TOOLHEAD_PARK_PAUSE_CANCEL {park_x} {park_y}
    {% endif %}
    RESPOND MSG="    @3 Client_cancel_print"
    _CLIENT_RETRACT LENGTH={retract}
    RESPOND MSG="    @4 Client_cancel_print"
    TURN_OFF_HEATERS
    RESPOND MSG="    @5 Client_cancel_print"
    M106 S0
    {client.user_cancel_macro|default("")}
    SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=idle_state VALUE=False
    SET_PAUSE_NEXT_LAYER ENABLE=0
    SET_PAUSE_AT_LAYER ENABLE=0 LAYER=0
    RESPOND MSG="    @6 Client_cancel_print"
    LED_IDLE
    RESPOND MSG="    @7 Client_cancel_print"
    CLEAR_PAUSE
    RESPOND MSG="    @8 Client_cancel_print"
    PRINT_END
    RESPOND MSG="    @9 Client_cancel_print"
    CANCEL_PRINT
    RESPOND MSG="    returning from Client_cancel_print"






[gcode_macro BRING_PRINT_FORWARD]
description: Move nozzle to rear-left corner of the bed with Z lift
gcode:
    {% set xmax = printer.toolhead.axis_maximum.x %}
    {% set ymax = printer.toolhead.axis_maximum.y %}
    G91
    G1 Z10 F2000
    G90
    G1 X0 Y{ymax} F6000

[gcode_macro TURN_HEATERS_OFF]    
gcode:
    M106 S0 ; Turn off fan
    M104 S0 ; Turn off hotend
    M140 S0 ; Turn off bed