[gcode_macro __CFG_MARKER_tests]
gcode:
    RESPOND PREFIX="CFG" MSG="Loaded: tests.cfg"

[gcode_macro GET_POSITION1]
gcode:
    RESPOND MSG="in [gcode_macro GET_POSITION1]"
    RESPOND MSG="Absolute Position: X{printer.toolhead.position.x} Y{printer.toolhead.position.y} Z{printer.toolhead.position.z}"
    RESPOND MSG="Gcode Position (last move): X{printer.gcode_move.gcode_position.x} Y{printer.gcode_move.gcode_position.y} Z{printer.gcode_move.gcode_position.z}"
    RESPOND MSG="Relative Position (from M114):"
    M114

[gcode_macro DISPLAY_PRINTER_COORDINATES]
description: displays the value of X Y Z
gcode:
    RESPOND MSG="IN [gcode_macro DISPLAY_PRINTER_COORDINATES]"

    {% set x = printer.gcode_move.position.x %}
    {% set y = printer.gcode_move.position.y %}
    {% set z = printer.gcode_move.position.z %}
    {% set e = printer.gcode_move.position.e %}

    {action_respond_info("Position: X=" ~ x ~ " Y=" ~ y ~ " Z=" ~ z ~ " E=" ~ e)}



[gcode_macro SAVE_PRINTER_COORDINATES]
description: saves the value of X Y Z
gcode:
    RESPOND MSG=" in [gcode_macro SAVE_PRINTER_COORDINATES]"
    {% set x = printer.gcode_move.position.x %}
    {% set y = printer.gcode_move.position.y %}
    {% set z = printer.gcode_move.position.z %}
    {% set e = printer.gcode_move.position.e %}
# =  printer["gcode_macro GLOBAL_STORAGE"].X 
    SET_GCODE_VARIABLE MACRO=GLOBAL_STORAGE VARIABLE=x VALUE="{x}"
    SET_GCODE_VARIABLE MACRO=GLOBAL_STORAGE VARIABLE=y VALUE="{y}"
    SET_GCODE_VARIABLE MACRO=GLOBAL_STORAGE VARIABLE=z VALUE="{z}"


    {action_respond_info("Position: X=" ~ x ~ " Y=" ~ y ~ " Z=" ~ z ~ " E=" ~ e)}

[gcode_macro RESTORE_PRINTER_COORDINATES1]
description: restores the value of X Y Z
gcode:
    RESPOND MSG=" in [gcode_macro RESTORE_PRINTER_COORDINATES1]"

    {% set storage = printer["gcode_macro GLOBAL_STORAGE"] %}
    G90
    G1 X{storage.x} Y{storage.y} F3000
    G1 Z{storage.z} F3000


[gcode_macro RESTORE_PRINTER_COORDINATES]
description: Moves the toolhead back to the saved X Y Z coordinates
gcode:
    RESPOND MSG="IN [gcode_macro RESTORE_PRINTER_COORDINATES]"
    {% set storage = printer["gcode_macro GLOBAL_STORAGE"] %}
    G90
    G1 X{storage.x} Y{storage.y} Z{storage.z} F3000
 

