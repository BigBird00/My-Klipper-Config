[gcode_macro __CFG_MARKER_power_loss_recovery_alt]
gcode:
    RESPOND PREFIX="CFG" MSG="Loaded: power_loss_recovery_alt.cfg"

[gcode_macro GLOBAL_STORAGE]
variable_totallayers: 0
variable_x: 0.0
variable_y: 0.0
variable_z: 0.0
gcode:
    M117 Global storage ready

[gcode_macro TEST_TOTAL]
gcode:
    RESPOND MSG="from TEST_TOTAL={printer['gcode_macro GLOBAL_STORAGE'].totallayers}"


[gcode_macro PLR_END_PRINT]
description: print end cleanup
gcode:
    RESPOND MSG="PLR_END_PRINT"

[gcode_macro SET_PLR_NEW_FILE]
description: layer change
gcode:
#     G31
#    RESPOND MSG="going to call save_last_file"
#    save_last_file
#    SAVE_VARIABLE VARIABLE=was_interrupted VALUE=True
#    SET_GCODE_VARIABLE VARIABLE=is_active VALUE=True




[gcode_macro LAYER_STATS]
variable_last_time: 0
variable_times: ""
gcode:

[gcode_macro PLR_SAVE_PRINT_STATE_WITH_LAYER]
description: layer change
gcode:
    {% set layer = params.L|default(0)|int %}
    {% set display_layer = layer + 1 %}

    {% set Z = params.Z|default(0)|float %}

    {% set TotLayers1 = printer["gcode_macro GLOBAL_STORAGE"].totallayers %}
    {% set display_total_layers = TotLayers1 + 1 %}

    {% set now = printer.print_stats.print_duration|float %}
    {% set last = printer["gcode_macro LAYER_STATS"].last_time|float %}


    {% if last <= 0 or now <= last %}
        SET_GCODE_VARIABLE MACRO=LAYER_STATS VARIABLE=last_time VALUE={now}
        RESPOND MSG="Layer Change: {display_layer}/{display_total_layers} Z:{Z}"
    {% else %}
        # existing averaging logic
    {% endif %}


    {% if last > 0 %}

        {% set elapsed = now - last %}

        # Build rolling list including current layer
        {% set csv = printer["gcode_macro LAYER_STATS"].times %}
        {% if csv %}
            {% set ns = namespace(items=csv.split(",")) %}
        {% else %}
            {% set ns = namespace(items=[]) %}
        {% endif %}

        {% set dummy = ns.items.append("%.1f"|format(elapsed)) %}

        {% if ns.items|length > 10 %}
            {% set ns.items = ns.items[-10:] %}
        {% endif %}

        # Average
        {% set ns2 = namespace(sum=0.0) %}
        {% for t in ns.items %}
            {% set ns2.sum = ns2.sum + (t|float) %}
        {% endfor %}

        {% set count = ns.items|length %}
        {% set avg = ns2.sum / count %}

# # # weighted avg

        # Weighted average (newest layer gets highest weight)
        {% set ns3 = namespace(weighted_sum=0.0, total_weight=0) %}
        
        {% for t in ns.items %}
            {% set weight = loop.index %}
            {% set ns3.weighted_sum = ns3.weighted_sum + ((t|float) * weight) %}
            {% set ns3.total_weight = ns3.total_weight + weight %}
        {% endfor %}
        
        {% set weighted_avg = ns3.weighted_sum / ns3.total_weight %}

# # # weighted avg


        # convert ETA into hh:mm:ss
        {% set layers_left = display_total_layers - display_layer %}
#        {% set eta_sec = layers_left * avg %}
        {% set eta_sec = layers_left * weighted_avg %}
        {% set eta_sec_i = eta_sec|int %}
        {% set eta_hours = eta_sec_i // 3600 %}
        {% set eta_minutes = (eta_sec_i % 3600) // 60 %}
        {% set eta_seconds = eta_sec_i % 60 %}
        
        {% if eta_hours > 0 %}
            {% set eta_str = "%d:%02d:%02d"|format(eta_hours, eta_minutes, eta_seconds) %}
        {% else %}
            {% set eta_str = "%02d:%02d"|format(eta_minutes, eta_seconds) %}
        {% endif %}

        # get string for ELAPSED hh:mm:ss
        {% if elapsed > 100 %}
            {% set t = elapsed|int %}
            {% set h = t // 3600 %}
            {% set m = (t % 3600) // 60 %}
            {% set s = t % 60 %}
    
            {% if h > 0 %}
                {% set elapsed_str = "%d:%02d:%02d"|format(h, m, s) %}
            {% else %}
                {% set elapsed_str = "%02d:%02d"|format(m, s) %}
            {% endif %}
        {% else %}
                {% set elapsed_str = "%.1fs"|format(elapsed) %}
        {% endif %}

        # get string for AVG hh:mm:ss
        {% if avg > 100 %}
            {% set avg_t = avg|int %}
            {% set avg_h = avg_t // 3600 %}
            {% set avg_m = (avg_t % 3600) // 60 %}
            {% set avg_s = avg_t % 60 %}
    
            {% if avg_h > 0 %}
                {% set avg_str = "%d:%02d:%02d"|format(avg_h, avg_m, avg_s) %}
            {% else %}
                {% set avg_str = "%02d:%02d"|format(avg_m, avg_s) %}
            {% endif %}
        {% else %}
                {% set avg_str = "%.1fs"|format(avg) %}
        {% endif %}


# convert weighted avg to string
        # get string for AVG hh:mm:ss
        {% if weighted_avg > 100 %}
            {% set wavg_t = weighted_avg|int %}
            {% set wavg_h = wavg_t // 3600 %}
            {% set wavg_m = (wavg_t % 3600) // 60 %}
            {% set wavg_s = wavg_t % 60 %}
    
            {% if wavg_h > 0 %}
                {% set wavg_str = "%d:%02d:%02d"|format(avg_h, avg_m, avg_s) %}
            {% else %}
                {% set wavg_str = "%02d:%02d"|format(avg_m, avg_s) %}
            {% endif %}
        {% else %}
                {% set wavg_str = "%.1fs"|format(weighted_avg) %}
        {% endif %}


        RESPOND MSG="alt:Layer={display_layer}/{display_total_layers} Z={Z} Last={elapsed_str} WeightAvg={wavg_str} ETA={eta_str}"
#        RESPOND MSG="alt:Layer={display_layer}/{display_total_layers} Z={Z} Last={elapsed_str} Avg{count}={avg_str} WeightAvg{wavg_str} ETA={eta_str}"

        SET_GCODE_VARIABLE MACRO=LAYER_STATS VARIABLE=times VALUE="'{ ns.items|join(',') }'"

    {% endif %}

    SET_GCODE_VARIABLE MACRO=LAYER_STATS VARIABLE=last_time VALUE={now}

#    RESPOND MSG="alt:Layer Change: {display_layer}/{display_total_layers} Z:{Z}"