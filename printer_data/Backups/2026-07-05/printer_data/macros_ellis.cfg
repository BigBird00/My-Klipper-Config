#macros_ellis.cfg
# ---------- HEAT PREP ----------


[gcode_macro ELLIS_MSG]
gcode:
  M117 {rawparams}

[gcode_macro ELLIS_BEEP]
gcode:
  M300 S1000 P400
  G4 P200
  M300 S1000 P400

[gcode_macro ELLIS_ALERT]
gcode:
  ELLIS_MSG {rawparams}
  ELLIS_BEEP


[gcode_macro ELLIS_PREP]
gcode:
  M140 S60
  M104 S210
  M190 S60
  M109 S210

# These presets assume DIRECT DRIVE (important)
# Tune PA and retraction per filament after calibration.

[gcode_macro FILAMENT_PLA]
description: PLA preset
gcode:
  SET_PRESSURE_ADVANCE ADVANCE=0.035
  SET_RETRACTION RETRACT_LENGTH=0.6 RETRACT_SPEED=35
  M104 S210
  M140 S60

  


[gcode_macro ELLIS_FULL_CALIBRATION]
gcode:
  ELLIS_ALERT Heating printer
  ELLIS_PREP
  G28

  ELLIS_ALERT Adjust bed screws, then RESUME
  SCREWS_TILT_CALCULATE
  PAUSE

  ELLIS_ALERT Set Z offset (paper test), then RESUME
  PROBE_CALIBRATE
  PAUSE

  SAVE_CONFIG

  G28
  PROBE_ACCURACY

  G28
  BED_MESH_CALIBRATE
  PAUSE

  SAVE_CONFIG

  FILAMENT_PLA
  ELLIS_ALERT Calibration COMPLETE


# ---------- LOAD MESH ----------
[gcode_macro ELLIS_LOAD_MESH]
gcode:
  BED_MESH_PROFILE LOAD=default

# ---------- PRESSURE ADVANCE ----------
[gcode_macro PA_RESET]
description: Reset Pressure Advance
gcode:
  SET_PRESSURE_ADVANCE ADVANCE=0



# PRESSURE ADVANCE LINE & TOWER MACROS

# These macros help you tune Pressure Advance per Ellis' guide.
# Use slicer PA tests when possible, but these are excellent helpers
# for quick on-printer testing.

[gcode_macro PA_LINE_TEST]
description: Ellis-style Pressure Advance Line Test
variable_start_pa: 0.00
variable_end_pa: 0.10
variable_pa_step: 0.005
variable_line_length: 120
variable_line_spacing: 6
variable_start_x: 20
variable_start_y: 20
variable_z: 0.28
gcode:
  {% set start = start_pa|float %}
  {% set end = end_pa|float %}
  {% set step = pa_step|float %}
  {% set lines = ((end - start) / step)|int + 1 %}

  M117 PA Line Test
  RESPOND MSG="Pressure Advance Line Test"

  G90
  G28
  G1 Z10 F3000
  G1 X{start_x} Y{start_y} F6000
  G1 Z{z} F1200

  {% for i in range(lines) %}
    {% set pa = start + (i * step) %}
    SET_PRESSURE_ADVANCE ADVANCE={pa|round(4)}
    RESPOND MSG="PA={pa|round(4)}"

    G1 X{start_x} Y{start_y + i * line_spacing} F6000
    G1 X{start_x + line_length} E5 F1200
  {% endfor %}

  SET_PRESSURE_ADVANCE ADVANCE=0
  M117 PA Test Complete


#------------------------------------------------------------

[gcode_macro PA_TOWER_START]
description: Start PA tower print
variable_pa_start: 0.00
variable_pa_step: 0.005
gcode:
  SET_PRESSURE_ADVANCE ADVANCE={pa_start}

[gcode_macro PA_TOWER_LAYER]
description: Increase PA every layer
gcode:
  {% set step = printer["gcode_macro PA_TOWER_START"].pa_step %}
  {% set current = printer.extruder.pressure_advance %}
  SET_PRESSURE_ADVANCE ADVANCE={current + step}



# FILAMENT-SPECIFIC PRESETS (ELLIS STYLE)


#

[gcode_macro FILAMENT_PETG]
description: PETG preset
gcode:
  SET_PRESSURE_ADVANCE ADVANCE=0.045
  SET_RETRACTION RETRACT_LENGTH=0.8 RETRACT_SPEED=30
  M104 S235
  M140 S80

[gcode_macro FILAMENT_ABS]
description: ABS preset
gcode:
  SET_PRESSURE_ADVANCE ADVANCE=0.050
  SET_RETRACTION RETRACT_LENGTH=0.7 RETRACT_SPEED=30
  M104 S240
  M140 S100


[gcode_macro TEST_SPEED]
description: Simple test macro to check if recognized
variable_SPEED: 300
gcode:
    {% set speed = SPEED|default(300)|int %}
    M117 TEST_SPEED running at speed {{speed}}

#################################################
#   Macro   TEST_SPEED
#################################################	
#ajs#gcode_macro TEST_SPEED]
#ajs# Home, get position, throw around toolhead, home again.
#ajs# If MCU stepper positions (first line in GET_POSITION) are greater than a full step different (your number of microsteps), then skipping occured.
#ajs# We only measure to a full step to accomodate for endstop variance.
#ajs# Example: TEST_SPEED SPEED=300 ACCEL=5000 ITERATIONS=10
#ajs#
#ajs#escription: Test for max speed and acceleration parameters for the printer. Procedure: Home -> ReadPositionFromMCU -> MovesToolhead@Vel&Accel -> Home -> ReadPositionfromMCU
#ajs#
#ajs#code:
#ajs#   # Speed
#ajs#   {% set speed  = params.SPEED|default(printer.configfile.settings.printer.max_velocity)|int %}
#ajs#   # Iterations
#ajs#   {% set iterations = params.ITERATIONS|default(5)|int %}
#ajs#   # Acceleration
#ajs#   {% set accel  = params.ACCEL|default(printer.configfile.settings.printer.max_accel)|int %}
#ajs#   # Minimum Cruise Ratio
#ajs#   {% set min_cruise_ratio = params.MIN_CRUISE_RATIO|default(0.5)|float %}
#ajs#   # Bounding inset for large pattern (helps prevent slamming the toolhead into the sides after small skips, and helps to account for machines with imperfectly set dimensions)
#ajs#   {% set bound = params.BOUND|default(20)|int %}
#ajs#   # Size for small pattern box
#ajs#   {% set smallpatternsize = SMALLPATTERNSIZE|default(20)|int %}
#ajs#   
#ajs#   # Large pattern
#ajs#       # Max positions, inset by BOUND
#ajs#       {% set x_min = printer.toolhead.axis_minimum.x %}
#ajs#       {% if x_min < 0 %}
#ajs#           {% set x_min = 0 %}
#ajs#       {% endif %}
#ajs#   
#ajs#       {% set y_min = printer.toolhead.axis_minimum.y %}
#ajs#       {% if y_min < 0 %}
#ajs#           {% set y_min = 0 %}
#ajs#       {% endif %}
#ajs#   
#ajs#       {% set x_min = x_min + bound %}
#ajs#       {% set x_max = printer.toolhead.axis_maximum.x - bound %}
#ajs#       {% set y_min = y_min + bound %}
#ajs#       {% set y_max = printer.toolhead.axis_maximum.y - bound %}
#ajs#   
#ajs#   # Small pattern at center
#ajs#       # Find X/Y center point
#ajs#       {% set x_center = (printer.toolhead.axis_minimum.x|float + printer.toolhead.axis_maximum.x|float ) / 2 %}
#ajs#       {% set y_center = (printer.toolhead.axis_minimum.y|float + printer.toolhead.axis_maximum.y|float ) / 2 %}
#ajs#       
#ajs#       # Set small pattern box around center point
#ajs#       {% set x_center_min = x_center - (smallpatternsize/2) %}
#ajs#       {% set x_center_max = x_center + (smallpatternsize/2) %}
#ajs#       {% set y_center_min = y_center - (smallpatternsize/2) %}
#ajs#       {% set y_center_max = y_center + (smallpatternsize/2) %}
#ajs#
#ajs#   # Save current gcode state (absolute/relative, etc)
#ajs#   SAVE_GCODE_STATE NAME=TEST_SPEED
#ajs#   
#ajs#   # Output parameters to g-code terminal
#ajs#   { action_respond_info("TEST_SPEED: starting %d iterations at speed %d, accel %d" % (iterations, speed, accel)) }
#ajs#   
#ajs#   # Home and get position for comparison later:
#ajs#       M400 # Finish moves - https://github.com/AndrewEllis93/Print-Tuning-Guide/issues/66
#ajs#       G28
#ajs#       # QGL if not already QGLd (only if QGL section exists in config)
#ajs#       {% if printer.configfile.settings.quad_gantry_level %}
#ajs#           {% if printer.quad_gantry_level.applied == False %}
#ajs#               QUAD_GANTRY_LEVEL
#ajs#               G28 Z
#ajs#           {% endif %}
#ajs#       {% endif %} 
#ajs#       # Move 50mm away from max position and home again (to help with hall effect endstop accuracy - https://github.com/AndrewEllis93/Print-Tuning-Guide/issues/24)
#ajs#       G90
#ajs#       G1 X{printer.toolhead.axis_maximum.x-50} Y{printer.toolhead.axis_maximum.y-50} F{30*60}
#ajs#       M400 # Finish moves - https://github.com/AndrewEllis93/Print-Tuning-Guide/issues/66
#ajs#       G28 X Y
#ajs#       G0 X{printer.toolhead.axis_maximum.x-1} Y{printer.toolhead.axis_maximum.y-1} F{30*60}
#ajs#       G4 P1000 
#ajs#       GET_POSITION
#ajs#
#ajs#   # Go to starting position
#ajs#   G0 X{x_min} Y{y_min} Z{bound + 10} F{speed*60}
#ajs#
#ajs#   # Set new limits
#ajs#   {% if printer.configfile.settings.printer.minimum_cruise_ratio is defined %}
#ajs#       SET_VELOCITY_LIMIT VELOCITY={speed} ACCEL={accel} MINIMUM_CRUISE_RATIO={min_cruise_ratio}
#ajs#   {% else %}
#ajs#       SET_VELOCITY_LIMIT VELOCITY={speed} ACCEL={accel} ACCEL_TO_DECEL={accel / 2}
#ajs#   {% endif %}
#ajs#
#ajs#   {% for i in range(iterations) %}
#ajs#       # Large pattern diagonals
#ajs#       G0 X{x_min} Y{y_min} F{speed*60}
#ajs#       G0 X{x_max} Y{y_max} F{speed*60}
#ajs#       G0 X{x_min} Y{y_min} F{speed*60}
#ajs#       G0 X{x_max} Y{y_min} F{speed*60}
#ajs#       G0 X{x_min} Y{y_max} F{speed*60}
#ajs#       G0 X{x_max} Y{y_min} F{speed*60}
#ajs#       
#ajs#       # Large pattern box
#ajs#       G0 X{x_min} Y{y_min} F{speed*60}
#ajs#       G0 X{x_min} Y{y_max} F{speed*60}
#ajs#       G0 X{x_max} Y{y_max} F{speed*60}
#ajs#       G0 X{x_max} Y{y_min} F{speed*60}
#ajs#   
#ajs#       # Small pattern diagonals
#ajs#       G0 X{x_center_min} Y{y_center_min} F{speed*60}
#ajs#       G0 X{x_center_max} Y{y_center_max} F{speed*60}
#ajs#       G0 X{x_center_min} Y{y_center_min} F{speed*60}
#ajs#       G0 X{x_center_max} Y{y_center_min} F{speed*60}
#ajs#       G0 X{x_center_min} Y{y_center_max} F{speed*60}
#ajs#       G0 X{x_center_max} Y{y_center_min} F{speed*60}
#ajs#       
#ajs#       # Small pattern box
#ajs#       G0 X{x_center_min} Y{y_center_min} F{speed*60}
#ajs#       G0 X{x_center_min} Y{y_center_max} F{speed*60}
#ajs#       G0 X{x_center_max} Y{y_center_max} F{speed*60}
#ajs#       G0 X{x_center_max} Y{y_center_min} F{speed*60}
#ajs#   {% endfor %}
#ajs#
#ajs#   # Restore max speed/accel/accel_to_decel to their configured values
#ajs#   {% if printer.configfile.settings.printer.minimum_cruise_ratio is defined %}
#ajs#       SET_VELOCITY_LIMIT VELOCITY={printer.configfile.settings.printer.max_velocity} ACCEL={printer.configfile.settings.printer.max_accel} MINIMUM_CRUISE_RATIO={printer.configfile.settings.printer.minimum_cruise_ratio} 
#ajs#   {% else %}
#ajs#       SET_VELOCITY_LIMIT VELOCITY={printer.configfile.settings.printer.max_velocity} ACCEL={printer.configfile.settings.printer.max_accel} ACCEL_TO_DECEL={printer.configfile.settings.printer.max_accel_to_decel}
#ajs#   {% endif %}
#ajs#
#ajs#   # Re-home and get position again for comparison:
#ajs#       M400 # Finish moves - https://github.com/AndrewEllis93/Print-Tuning-Guide/issues/66
#ajs#       G28 # This is a full G28 to fix an issue with CoreXZ - https://github.com/AndrewEllis93/Print-Tuning-Guide/issues/12
#ajs#       # Go to XY home positions (in case your homing override leaves it elsewhere)
#ajs#       G90
#ajs#       G0 X{printer.toolhead.axis_maximum.x-1} Y{printer.toolhead.axis_maximum.y-1} F{30*60}
#ajs#       G4 P1000 
#ajs#       GET_POSITION
#ajs#
#ajs#   # Restore previous gcode state (absolute/relative, etc)
#ajs#   RESTORE_GCODE_STATE NAME=TEST_SPEED
    	
	
	

