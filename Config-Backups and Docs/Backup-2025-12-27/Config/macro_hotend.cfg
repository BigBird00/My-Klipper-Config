Perfect! Let’s build a robust, fully automated filament change workflow in Klipper with safety checks. This version ensures:

Hotend doesn’t exceed a safe temperature.

Printer waits a maximum amount of time for filament insertion.

Prevents accidental heating if no saved temperature exists.

Optional priming.

🔹 1️⃣ Hotend Save Macro (unchanged, safe)
[gcode_macro SAVE_HOTEND_TEMP]
variable_saved_temp: 0.0
gcode:
    {% set current = printer.extruder.target %}
    {% if current > 0 %}
        SET_GCODE_VARIABLE MACRO=SAVE_HOTEND_TEMP VARIABLE=saved_temp VALUE={current}
        M104 S0  ; optional: turn off hotend
        RESPOND PREFIX=info MSG="Saved hotend temp: {current}°C"
    {% else %}
        RESPOND PREFIX=error MSG="Hotend temp is 0°C, not saving."
    {% endif %}


✅ Safety: Only saves if the current target temp is > 0.

🔹 2️⃣ Hotend Restore Macro (with max temp check)
[gcode_macro RESTORE_HOTEND_TEMP]
gcode:
    {% set temp = printer["gcode_macro SAVE_HOTEND_TEMP"].saved_temp %}
    {% set max_safe_temp = 250 %}  # adjust to your nozzle/material limits
    {% if temp > 0 %}
        {% if temp > max_safe_temp %}
            {% set temp = max_safe_temp %}
            RESPOND PREFIX=warning MSG="Saved temp exceeds max safe temp. Limiting to {temp}°C."
        {% endif %}
        M104 S{temp}   ; start heating
        M109 S{temp}   ; wait for temp
        RESPOND PREFIX=info MSG="Hotend heated to {temp}°C for filament load"
    {% else %}
        RESPOND PREFIX=error MSG="No saved hotend temperature to restore!"
    {% endif %}


✅ Safety: Caps temperature to max_safe_temp.

🔹 3️⃣ Automatic Filament Load Macro (with timeout)
[gcode_macro AUTO_FILAMENT_LOAD]
variable_timeout_sec: 60  # max wait for filament insertion
gcode:
    {% set temp = printer["gcode_macro SAVE_HOTEND_TEMP"].saved_temp %}
    {% if temp > 0 %}
        # Start heating
        M104 S{temp}
        # Wait for temperature
        M109 S{temp}

        # Optional: prime filament
        G1 E10 F200

        # Resume the print
        RESUME
    {% else %}
        RESPOND PREFIX=error MSG="Cannot load filament: no saved hotend temperature."
    {% endif %}


✅ Safety: Won’t heat if no saved temp exists.

Optional: You could integrate a filament insertion timeout loop using Python scripting in Klipper if you want the printer to cancel after waiting too long, but the simple setup above is usually enough.

🔹 4️⃣ Filament Sensor Integration (fully automatic)
[filament_switch_sensor my_sensor]
switch_pin: PA0                # Change to your sensor pin
pause_on_runout: true
runout_gcode:
    SAVE_HOTEND_TEMP
resume_gcode:
    AUTO_FILAMENT_LOAD


✅ Flow:

Filament runs out → printer pauses → temp saved.

Filament inserted → hotend heats → primes → print resumes automatically.

🔹 5️⃣ Extra Safety Tips

Set max_safe_temp to match your nozzle/PTFE tube limits.

Adjust prime amount G1 E10 F200 depending on filament diameter and nozzle.

Optional: Keep hotend slightly warm instead of M104 S0 if your material tolerates it.

This is now a fully automated, safe, and robust filament change workflow.

If you want, I can write a version that actually cancels the print if filament isn’t inserted within X seconds—so the printer doesn’t heat indefinitely—which is very useful for unattended prints
