# macro_hotend.cfg

# USAGE:
#  SAVE_HOTEND_TEMP
#  ; do something (tool change, filament change, pause, etc.)
#  RESTORE_HOTEND_TEMP




# SAVE_HOTEND_TEMP
#   Reads the current target temperature (printer.extruder.target)
#   Stores it in saved_temp
#   Turns off the hotend heater
#   Keeps the value in memory until Klipper restarts
# ## ! Use target, not temperature, so you restore the setpoint, not the current cooling temp.
[gcode_macro SAVE_HOTEND_TEMP]
variable_saved_temp: 0.0
gcode:
    {% set current = printer.extruder.target %}
    SET_GCODE_VARIABLE MACRO=SAVE_HOTEND_TEMP VARIABLE=saved_temp VALUE={current}
    M104 S0
    RESPOND PREFIX=info MSG="Saved hotend temp: {current}°C and heater turned off"

# RESTORE_HOTEND_TEMP
# Reads saved temp variable from SAVE_HOTEND_TEMP
# Sets and waits for the hotend to reach temperature
# Errors gracefully if nothing was saved
[gcode_macro RESTORE_HOTEND_TEMP]
gcode:
    {% set temp = printer["gcode_macro SAVE_HOTEND_TEMP"].saved_temp %}
    {% if temp > 0 %}
        M109 S{temp}
        RESPOND PREFIX=info MSG="Restored hotend temp to {temp}°C"
    {% else %}
        RESPOND PREFIX=error MSG="No saved hotend temperature"
    {% endif %}



